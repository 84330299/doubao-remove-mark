[project]
name = "doubao-remove-mark"
version = "0.1.1"
description = "无印豆包桌面客户端 - 从豆包(Doubao)对话链接中提取无水印图片和视频资源"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.6",
    "cryptography>=44.0.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
